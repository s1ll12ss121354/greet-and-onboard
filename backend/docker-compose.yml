services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: recorn
      POSTGRES_PASSWORD: recorn
      POSTGRES_DB: recorn
    ports: ["5432:5432"]
    volumes: ["recorn_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000","9001:9001"]
    volumes: ["recorn_minio:/data"]
volumes:
  recorn_pg:
  recorn_minio:
