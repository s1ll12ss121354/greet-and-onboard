name: Verify Recorn code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorn-code-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint code (skip existing formatting-only violations)
        run: bun run lint -- --rule 'prettier/prettier: off'
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Backend TypeScript build
        working-directory: backend
        run: |
          bun install
          bun run build
