name: Verify build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use stable npm
        run: npm install --global npm@10.8.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
