name: Verify Recorn code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bunx eslint . --rule '{"prettier/prettier":"off","@typescript-eslint/no-explicit-any":"off","prefer-const":"off"}'
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Backend TypeScript build
        run: |
          cd backend
          bun install
          bun run prisma:generate
          bun run build
